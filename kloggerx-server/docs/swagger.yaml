basePath: /api/v1
definitions:
  model.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  service.LoginReq:
    properties:
      email:
        maxLength: 200
        type: string
      password:
        maxLength: 128
        type: string
    required:
    - email
    - password
    type: object
  service.RegisterReq:
    properties:
      confirmPassword:
        maxLength: 128
        type: string
      email:
        maxLength: 200
        type: string
      password:
        maxLength: 128
        minLength: 6
        type: string
      username:
        maxLength: 20
        minLength: 2
        type: string
    required:
    - confirmPassword
    - email
    - password
    - username
    type: object
host: localhost:8080
info:
  contact: {}
  description: KloggerX 知识协作平台 API 文档
  title: KloggerX API
  version: "1.0"
